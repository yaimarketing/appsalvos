# Blueprint do Render (render.com): plano gratuito, publica a cada push na branch escolhida.
services:
  - type: web
    name: appsalvos
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Senha de acesso ao site: o Render pede o valor ao criar o serviço.
      - key: APP_PASSWORD
        sync: false
      # Chave que criptografa os links do conector (gerada automaticamente pelo Render).
      - key: APP_SECRET
        generateValue: true
      # O plano grátis tem 512 MB de memória: Whisper no modelo menor.
      - key: WHISPER_MODEL
        value: Xenova/whisper-tiny
